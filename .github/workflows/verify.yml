name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # windows-latest 预装 Chrome(CHROME_CANDIDATES 已覆盖其默认安装路径)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - run: npm run verify
